version: '3.8'

services:
  api:
    build: .
    container_name: mydevenv-api
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - ./db.sqlite3:/app/db.sqlite3
    environment:
      - ENV=dev
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-mydevenv}
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    image: node:18-alpine
    container_name: mydevenv-frontend
    working_dir: /app
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    command: sh -c "npm install && npm run dev -- --host"
    restart: unless-stopped
    depends_on:
      - api

